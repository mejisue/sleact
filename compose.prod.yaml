services:
  mysql:
    image: mysql:8.0
    container_name: shared-mysql
    env_file:
      - .env.prod
    environment:
      # MYSQL_DATABASE 제거 — mysql-init/init.sh 에서 3개 DB 직접 생성
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d  # sleact, mywebsite, threaleact DB 초기화
    ports:
      - "3306:3306"  # mywebsite, threaleact 백엔드가 172.17.0.1:3306 으로 접근
    networks:
      - sleact-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: sleact-redis
    volumes:
      - redis_data:/data
    networks:
      - sleact-network
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/sleact-backend:latest
    container_name: sleact-backend
    env_file:
      - .env.prod
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m
      - DB_HOST=mysql  # 같은 compose 네트워크이므로 컨테이너명으로 접근
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8083:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sleact-network
    restart: unless-stopped

networks:
  sleact-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
