spring:
  profiles:
    active: local
  application:
    name: sleact
  # 데이터베이스 연결 설정
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 및 하이버네이트 설정
  jpa:
    hibernate:
      # 앱 실행 시 엔티티를 보고 테이블을 자동으로 생성/수정해줍니다.
      ddl-auto: update
    show-sql: true        # 실행되는 SQL을 콘솔에 출력
    properties:
      hibernate:
        format_sql: true  # SQL을 보기 좋게 정렬해서 출력
        dialect: org.hibernate.dialect.MySQLDialect

