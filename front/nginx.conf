server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA: 새로고침 시 404 방지
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 장기 캐시 (해시 포함 파일명이므로 안전)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
